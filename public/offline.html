<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sense connexió - Òrbita Events</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 400px;
    }

    .icon {
      font-size: 80px;
      margin-bottom: 24px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.8; }
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    p {
      color: rgba(255, 255, 255, 0.6);
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      background: #f59e0b;
      color: black;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .retry-btn:hover {
      background: #fbbf24;
      transform: scale(1.02);
    }

    .retry-btn:active {
      transform: scale(0.98);
    }

    .contact {
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .contact p {
      font-size: 14px;
      margin-bottom: 16px;
    }

    .contact a {
      color: #f59e0b;
      text-decoration: none;
      font-weight: 500;
    }

    .logo {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 700;
    }

    .logo span {
      color: #f59e0b;
    }
  </style>
</head>
<body>
  <div class="logo">
    <span>Ò</span>rbita Events
  </div>

  <div class="container">
    <div class="icon">📡</div>
    <h1>Sense connexió</h1>
    <p>
      Sembla que no tens connexió a Internet en aquest moment.
      Comprova la teva connexió i torna-ho a intentar.
    </p>
    <button class="retry-btn" onclick="location.reload()">
      🔄 Tornar a intentar
    </button>

    <div class="contact">
      <p>Necessites ajuda urgent?</p>
      <a href="tel:+34699121023">📞 +34 699 121 023</a>
    </div>
  </div>

  <script>
    // Detectar cuando vuelve la conexión
    window.addEventListener('online', () => {
      location.reload();
    });
  </script>
</body>
</html>
