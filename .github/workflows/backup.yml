name: Weekly DB Backup

on:
  schedule:
    # Cada dilluns a les 3:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch: # Permet execució manual

jobs:
  backup:
    name: PostgreSQL Backup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client

      - name: Create backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          TIMESTAMP=$(date +"%Y-%m-%d-%H%M%S")
          BACKUP_FILE="db-${TIMESTAMP}.sql.gz"
          pg_dump "$DATABASE_URL" --no-owner --no-privileges --clean --if-exists | gzip > "$BACKUP_FILE"
          echo "BACKUP_FILE=$BACKUP_FILE" >> $GITHUB_ENV
          echo "Backup creat: $BACKUP_FILE ($(du -h "$BACKUP_FILE" | cut -f1))"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 90
