name: Daily Cron Jobs

on:
  schedule:
    # Reconciliació freqüent per mantenir Google Calendar al dia.
    - cron: '*/15 * * * *'
    # Passada diària completa a les 3:00 UTC.
    - cron: '0 3 * * *'
  workflow_dispatch: # Permet execució manual

jobs:
  calendar-sync:
    name: Reconcile Google Calendar
    runs-on: ubuntu-latest
    steps:
      - name: calendar-sync
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://orbitaevents.com/api/cron/calendar-sync")
          echo "calendar-sync: $status"
          [ "$status" = "200" ] || exit 1

  crons:
    name: Run all cron jobs
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: lead-cleanup
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://orbitaevents.com/api/cron/lead-cleanup")
          echo "lead-cleanup: $status"
          [ "$status" = "200" ] || exit 1

      - name: reviews-sync
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://orbitaevents.com/api/cron/reviews-sync")
          echo "reviews-sync: $status"
          [ "$status" = "200" ] || exit 1

      - name: post-event
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://orbitaevents.com/api/cron/post-event")
          echo "post-event: $status"
          [ "$status" = "200" ] || exit 1

      - name: pack-pricing-check
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://orbitaevents.com/api/cron/pack-pricing-check")
          echo "pack-pricing-check: $status"
          [ "$status" = "200" ] || exit 1

      - name: invoice-sync
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://orbitaevents.com/api/cron/invoice-sync")
          echo "invoice-sync: $status"
          [ "$status" = "200" ] || exit 1

      - name: fuel-daily
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://orbitaevents.com/api/cron/fuel-daily")
          echo "fuel-daily: $status"
          [ "$status" = "200" ] || exit 1

      - name: commercial-daily
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://orbitaevents.com/api/cron/commercial-daily")
          echo "commercial-daily: $status"
          [ "$status" = "200" ] || exit 1

      - name: customer-lifecycle
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://orbitaevents.com/api/cron/customer-lifecycle")
          echo "customer-lifecycle: $status"
          [ "$status" = "200" ] || exit 1

      - name: tasks-auto
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://orbitaevents.com/api/cron/tasks-auto")
          echo "tasks-auto: $status"
          [ "$status" = "200" ] || exit 1

      - name: urgent-followup-alerts
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://orbitaevents.com/api/cron/urgent-followup-alerts")
          echo "urgent-followup-alerts: $status"
          [ "$status" = "200" ] || exit 1

      - name: lead-reengagement
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://orbitaevents.com/api/cron/lead-reengagement")
          echo "lead-reengagement: $status"
          [ "$status" = "200" ] || exit 1

      - name: dossier-trash-purge
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://orbitaevents.com/api/cron/dossier-trash-purge")
          echo "dossier-trash-purge: $status"
          [ "$status" = "200" ] || exit 1

  # Benchmark setmanal — només dilluns
  # El job s'executa cada dia però el step-level "Check if Monday" el bloqueja
  # excepte els dilluns (o via workflow_dispatch manual).
  weekly-benchmark:
    name: Weekly benchmark (Monday only)
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Check if Monday
        id: check-day
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            echo "is_monday=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_monday=false" >> "$GITHUB_OUTPUT"
          fi

      - name: weekly-benchmark
        if: steps.check-day.outputs.is_monday == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://orbitaevents.com/api/cron/weekly-benchmark")
          echo "weekly-benchmark: $status"
          [ "$status" = "200" ] || exit 1
