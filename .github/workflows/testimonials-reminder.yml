name: Testimonials Reminder

on:
  schedule:
    # GitHub Actions uses UTC. Adjust if you want 09:00 Europe/Madrid year-round.
    - cron: "0 7 * * *"
  workflow_dispatch: {}

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Call testimonials reminder cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.ORBITA_SITE_URL }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing CRON_SECRET secret"
            exit 1
          fi
          BASE_URL="${SITE_URL:-https://orbitaevents.com}"
          curl -sS -X GET "$BASE_URL/api/cron/testimonials-reminder" \
            -H "Authorization: Bearer $CRON_SECRET"
